spring.application.name=library
spring.profiles.active=dev

### Postgres Database Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/library_db
spring.datasource.username=postgres
spring.datasource.password=postgres

### JPA & Hibernate Properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

spring.web.error.include-message=always

### JWT Configurations
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971
jwt.expiration-minutes=60

### Pageable Properties
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

### Borrowing Properties
borrowing.max-borrow=5
borrowing.max-fines=500
borrowing.period-days=14
borrowing.per-day-fine=10

### Reservation Properties
reservation.expiry-hours=48
